# =====================================================================
# Albsale Vlora — Custom ERP · VirtualHost për XAMPP (Apache)
# ---------------------------------------------------------------------
# Web-root i VETËM = erp/public  (siguri: asgjë jashtë public/ nuk shërbehet)
#
# INSTALIMI:
#  1) Ngjite këtë bllok në fund të:
#       C:\xampp\apache\conf\extra\httpd-vhosts.conf
#  2) Sigurohu që te C:\xampp\apache\conf\httpd.conf është aktive rreshti:
#       Include conf/extra/httpd-vhosts.conf
#  3) Shto te C:\Windows\System32\drivers\etc\hosts (si Administrator):
#       127.0.0.1   albsale.local
#  4) Rinis Apache nga XAMPP Control Panel.
#  5) Hap:  http://albsale.local/
# =====================================================================

<VirtualHost *:80>
    ServerName albsale.local
    DocumentRoot "C:/Users/RexhoIlirjan/albsale-digital-enterprise-landscape/erp/public"

    <Directory "C:/Users/RexhoIlirjan/albsale-digital-enterprise-landscape/erp/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require local
    </Directory>

    ErrorLog  "logs/albsale-error.log"
    CustomLog "logs/albsale-access.log" common
</VirtualHost>

# ---------------------------------------------------------------------
# ALTERNATIVË E SHPEJTË (pa vhost, pa hosts file): Apache Alias.
# Ngjite te httpd.conf në vend të vhost-it, pastaj hap http://localhost/albsale/
# ---------------------------------------------------------------------
# Alias /albsale "C:/Users/RexhoIlirjan/albsale-digital-enterprise-landscape/erp/public"
# <Directory "C:/Users/RexhoIlirjan/albsale-digital-enterprise-landscape/erp/public">
#     Options -Indexes +FollowSymLinks
#     AllowOverride All
#     Require local
# </Directory>
